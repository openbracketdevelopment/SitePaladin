[package]
name = "sitepaladin"
default-run = "sitepaladin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A self-hosted website link and SEO metadata auditor"

[features]
dev-fixtures = []

[dependencies]
argon2 = "0.5"
askama = "0.14"
axum = { version = "0.8", features = ["form", "json", "macros"] }
csv = "1.3"
dotenvy = "0.15"
futures-util = "0.3"
http = "1"
httpdate = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
robotstxt = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "zstd"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-sessions = { version = "0.15", features = ["signed"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = { version = "0.8", features = ["form", "json", "macros"] }

[[bin]]
name = "sitepaladin"
path = "src/main.rs"

[[bin]]
name = "fixture-site"
path = "src/bin/fixture-site.rs"
required-features = ["dev-fixtures"]
