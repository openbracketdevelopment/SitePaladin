name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: bytedown
          POSTGRES_DB: bytedown_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U bytedown -d bytedown_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://bytedown@localhost:5432/bytedown_test?sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev pkg-config libheif-plugin-aomenc libheif-plugin-aomdec
      - run: go test -race ./... && go vet ./...
      - name: Validate deployment and examples
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export API_KEY="$(openssl rand -hex 32)"
          docker compose config --quiet
          python3 examples/demo.py --help
          node --check examples/server-upload.mjs
          docker build -t bytedown:ci .
          docker run --rm bytedown:ci probe
